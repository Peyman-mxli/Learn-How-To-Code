name: One-Time Python Curriculum Cleanup

on:
  push:
    paths:
      - ".github/maintenance/python_curriculum_cleanup.py"
      - ".github/workflows/python-curriculum-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanitize Python curriculum
        run: python .github/maintenance/python_curriculum_cleanup.py

      - name: Compile curriculum
        run: python -m compileall -q 01-INTRODUCTIONS/02-PYTHON

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-INTRODUCTIONS/02-PYTHON
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make Python curriculum compiler-valid"
            git push
          fi
