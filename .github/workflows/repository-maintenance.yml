name: Repository Description Update

on:
  push:
    paths:
      - ".github/workflows/repository-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Update repository description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}"             -f description="A structured programming learning portfolio covering Python, C#, Kotlin, Git/GitHub, data structures, algorithms, automated testing, and practical software projects."
