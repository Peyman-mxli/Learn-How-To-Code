name: One-Time Repository Maintenance
on:
  push:
    paths:
      - ".github/maintenance/repository_cleanup.py"
      - ".github/workflows/repository-maintenance.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/maintenance/repository_cleanup.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Complete repository-wide cleanup and normalization"
            git push
          fi
