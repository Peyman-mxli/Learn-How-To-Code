name: Repository Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python projects
        run: |
          python -m compileall -q             02-PROJECTS/01-PROJECT-CLI-CALCULATOR             02-PROJECTS/02-TODO-APP             02-PROJECTS/05-BIBLOTECA-POO             02-PROJECTS/06-VETERINARIA-POO             02-PROJECTS/07-zoo_poo

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build C# project
        run: |
          dotnet build             03-CSHARP-PROJECTS/01-STUDENT-MANAGEMENT-SYSTEM/StudentManagementSystem.csproj             --configuration Release

      - name: Reject tracked generated cache files
        run: |
          tracked_bad_files="$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|desktop\.ini$)' || true)"
          if [ -n "$tracked_bad_files" ]; then
            echo "Generated cache/OS files are tracked:"
            echo "$tracked_bad_files"
            exit 1
          fi

      - name: Reject hard-coded application secrets
        run: |
          bad_secret_lines="$(git grep -nE 'app\.secret_key\s*=\s*["'\'''][^$]' -- '*.py' || true)"
          bad_admin_lines="$(git grep -nE 'ADMIN_VERIFY_CODE\s*=\s*["'\''']' -- '*.py' || true)"
          if [ -n "$bad_secret_lines$bad_admin_lines" ]; then
            echo "Possible hard-coded application secret found:"
            printf '%s\n%s\n' "$bad_secret_lines" "$bad_admin_lines"
            exit 1
          fi
