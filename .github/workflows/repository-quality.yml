name: Repository Quality

on:
  push:
  pull_request:

jobs:
  python:
    name: Python compile and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python projects
        run: |
          python -m compileall -q \
            02-PROJECTS/01-CLI-CALCULATOR \
            02-PROJECTS/02-TODO-APP \
            02-PROJECTS/03-VEHICLE-MANAGEMENT-SYSTEM \
            02-PROJECTS/04-UNITRACK \
            02-PROJECTS/05-LIBRARY-OOP \
            02-PROJECTS/06-VETERINARY-OOP \
            02-PROJECTS/07-ZOO-OOP
      - name: Compile Unicode learning files
        run: |
          python -m py_compile \
            01-INTRODUCTIONS/04-EMOJIS/ALT-CODES-NOTES.py \
            01-INTRODUCTIONS/04-EMOJIS/ALT-CODES-EXAMPLES.py \
            01-INTRODUCTIONS/04-EMOJIS/TASKS.py \
            01-INTRODUCTIONS/04-EMOJIS/TASK-SOLUTION.py
      - name: Run calculator tests
        run: python -m unittest discover -s 02-PROJECTS/01-CLI-CALCULATOR/tests -v
      - name: Run todo tests
        run: python -m unittest discover -s 02-PROJECTS/02-TODO-APP/tests -v
      - name: Run vehicle tests
        working-directory: 02-PROJECTS/03-VEHICLE-MANAGEMENT-SYSTEM
        run: python -m unittest discover -s tests -v
      - name: Install UniTrack dependencies
        run: pip install -r 02-PROJECTS/04-UNITRACK/requirements.txt
      - name: Run UniTrack smoke tests
        run: python -m unittest discover -s 02-PROJECTS/04-UNITRACK/tests -v

  csharp:
    name: C# build tests and curriculum syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Student Management System
        run: dotnet build 03-CSHARP-PROJECTS/01-STUDENT-MANAGEMENT-SYSTEM/StudentManagementSystem.csproj --configuration Release
      - name: Run Student Management tests
        run: dotnet test 03-CSHARP-PROJECTS/01-STUDENT-MANAGEMENT-SYSTEM/StudentManagementSystem.Tests/StudentManagementSystem.Tests.csproj --configuration Release
      - name: Parse every C# curriculum source file
        run: dotnet run --project .github/tools/CSharpSyntaxValidator/CSharpSyntaxValidator.csproj --configuration Release -- 01-INTRODUCTIONS

  kotlin:
    name: Kotlin compiler validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Kotlin compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y kotlin
          kotlinc -version
      - name: Compile every Kotlin learning source file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d "" file; do
            echo "Checking $file"
            output="/tmp/kotlin-check-$count.jar"
            kotlinc "$file" -d "$output"
            rm -f "$output"
            count=$((count + 1))
          done < <(find 01-INTRODUCTIONS/10-KOTLIN -type f -name "*.kt" -print0 | sort -z)
          echo "Compiled $count Kotlin files successfully."

  curriculum-hygiene:
    name: Curriculum and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate curriculum and repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          problems = []
          fence = chr(96) * 3

          for source in Path("01-INTRODUCTIONS").rglob("*.cs"):
              text = source.read_text(encoding="utf-8")
              if fence + "csharp" in text.lower() or fence + "cs" in text.lower() or "# /*" in text:
                  problems.append(f"Invalid Markdown/C# mixing: {source}")

          kotlin_root = Path("01-INTRODUCTIONS/10-KOTLIN")
          for number in range(17):
              matches = sorted(kotlin_root.glob(f"{number:02d}-*"))
              if len(matches) != 1:
                  problems.append(f"Kotlin module {number:02d} missing or duplicated")
                  continue
              folder = matches[0]
              for name in ("README.md", "Notes.kt", "Examples.kt", "Tasks.kt", "Tasks_Solutions.kt"):
                  if not (folder / name).exists():
                      problems.append(f"Missing Kotlin file: {folder / name}")

          allowed_extensionless = {"LICENSE", ".gitignore"}
          for item in Path(".").rglob("*"):
              if not item.is_file() or ".git" in item.parts:
                  continue
              if not item.suffix and item.name not in allowed_extensionless:
                  problems.append(f"Unexpected extensionless file: {item}")

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for item in tracked:
              lowered = item.lower()
              if "/__pycache__/" in lowered or lowered.endswith(".pyc") or lowered.endswith("desktop.ini") or lowered.endswith(".ds_store"):
                  problems.append(f"Generated file tracked: {item}")

          forbidden = ("250161@upbc.edu.mx", "mxli.peyman@gmail.com", "+526865090453")
          for root in ("01-INTRODUCTIONS", "02-PROJECTS", "03-CSHARP-PROJECTS"):
              for item in Path(root).rglob("*"):
                  if not item.is_file():
                      continue
                  try:
                      text = item.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if any(value.lower() in text.lower() for value in forbidden):
                      problems.append(f"Public contact metadata remains: {item}")
                  if "id: 250161" in text.lower():
                      problems.append(f"Student ID remains: {item}")

          obsolete = (
              "02-PROJECTS/03-VEHICLE-MANAGEMENT-SYSTEM/Structure_info.txt",
              "02-PROJECTS/03-VEHICLE-MANAGEMENT-SYSTEM/static",
              "02-PROJECTS/03-VEHICLE-MANAGEMENT-SYSTEM/templates",
              "02-PROJECTS/04-UNITRACK/Static",
              "02-PROJECTS/04-UNITRACK/Texts",
          )
          for value in obsolete:
              if Path(value).exists():
                  problems.append(f"Obsolete path still present: {value}")

          if problems:
              print("\n".join(problems))
              sys.exit(1)

          print("Curriculum and repository hygiene checks passed.")
          PY
      - name: Reject hard-coded application secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = [
              re.compile(r'app\.secret_key\s*=\s*["\'][^$][^"\']*["\']'),
              re.compile(r'ADMIN_VERIFY_CODE\s*=\s*["\'][^"\']+["\']'),
          ]
          findings = []
          for source in Path("02-PROJECTS").rglob("*.py"):
              text = source.read_text(encoding="utf-8")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if any(pattern.search(line) for pattern in patterns):
                      findings.append(f"{source}:{line_number}: {line.strip()}")
          if findings:
              print("Possible hard-coded application secret found:")
              print("\n".join(findings))
              sys.exit(1)
          PY
