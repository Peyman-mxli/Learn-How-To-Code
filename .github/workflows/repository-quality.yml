name: Repository Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python projects
        run: |
          python -m compileall -q             02-PROJECTS/01-PROJECT-CLI-CALCULATOR             02-PROJECTS/02-TODO-APP             02-PROJECTS/05-BIBLOTECA-POO             02-PROJECTS/06-VETERINARIA-POO             02-PROJECTS/07-zoo_poo

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build C# project
        run: |
          dotnet build             03-CSHARP-PROJECTS/01-STUDENT-MANAGEMENT-SYSTEM/StudentManagementSystem.csproj             --configuration Release

      - name: Reject tracked generated cache files
        run: |
          tracked_bad_files="$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|desktop\.ini$)' || true)"
          if [ -n "$tracked_bad_files" ]; then
            echo "Generated cache/OS files are tracked:"
            echo "$tracked_bad_files"
            exit 1
          fi

      - name: Reject hard-coded application secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = [
              re.compile(r'app\.secret_key\s*=\s*["\'][^$][^"\']*["\']'),
              re.compile(r'ADMIN_VERIFY_CODE\s*=\s*["\'][^"\']+["\']'),
          ]

          findings = []
          for path in Path(".").rglob("*.py"):
              if ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  if any(pattern.search(line) for pattern in patterns):
                      findings.append(f"{path}:{line_number}: {line.strip()}")

          if findings:
              print("Possible hard-coded application secret found:")
              print("\n".join(findings))
              sys.exit(1)
          PY
